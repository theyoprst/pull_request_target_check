name: Check Secret Access

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize
    runs-on: ubuntu-latest
    environment: >-
      ${{
        github.event.pull_request.head.repo.full_name != github.repository
        && 'fork-ci' || ''
      }}
    steps:
      - run: echo "Authorized"

  check-secret:
    name: Check Secret
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify secret is available
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
        run: |
          if [ -n "$TEST_SECRET" ]; then
            echo "SUCCESS: Secret is available"
          else
            echo "FAILURE: Secret is empty or not set"
            exit 1
          fi

      - name: Verify correct code is checked out
        run: |
          echo "Checked out SHA: $(git rev-parse HEAD)"
          echo "Expected SHA: ${{ github.event.pull_request.head.sha }}"
          echo "Fail"
          exit 1
